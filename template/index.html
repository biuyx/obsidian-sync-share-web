<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>
        <%= htmlWebpackPlugin.options.title %>
    </title>
    <script>
        // 错误显示层: 任何 JS 错误/资源加载失败直接显示在屏幕上(排查白屏用)
        (function () {
            function showError(msg) {
                try {
                    var d = document.createElement("div");
                    d.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#fff;color:#c00;padding:20px;font-size:13px;overflow:auto;white-space:pre-wrap;font-family:monospace;";
                    d.textContent = "[Page Error] " + new Date().toLocaleString() + "\n" + msg;
                    document.body.appendChild(d);
                } catch (e) { }
            }
            window.addEventListener("error", function (e) {
                showError("error: " + (e.message || e.type) + "\nfile: " + (e.filename || "") + ":" + (e.lineno || ""));
            }, true);
            window.addEventListener("unhandledrejection", function (e) {
                var r = e.reason;
                showError("unhandledrejection: " + (r && r.message ? r.message : String(r)));
            });
            document.addEventListener("error", function (e) {
                var t = e.target;
                if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
                    showError("resource load failed: " + (t.src || t.href));
                }
            }, true);
        })();
    </script>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    <style>
        @media (prefers-reduced-motion: no-preference) {
            html {
                scroll-behavior: smooth;
            }
        }

        html {
            scroll-padding-top: 80px;
        }

        ::-webkit-scrollbar {
            height: 1rem;
            width: .5rem
        }

        ::-webkit-scrollbar:horizontal {
            height: .5rem;
            width: 1rem
        }

        ::-webkit-scrollbar-track {
            background-color: transparent;
            border-radius: 9999px
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(217, 217, 227, .8);
            border-color: rgba(255, 255, 255, 1);
            border-radius: 9999px;
            border-width: 1px
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(236, 236, 241, 1)
        }

        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background-color: rgba(86, 88, 105, 1)
        }

        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(172, 172, 190, 1)
        }
    </style>
</head>

<body>
    <noscript> 您的浏览器禁用了javasciprt,请开启后访问. </noscript>
    <div id="root">
    </div>
</body>

</html>
